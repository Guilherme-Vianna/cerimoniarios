<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7a1f3d" />
    <title>Sem conexão · Cerimoniários Católicos</title>
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #faf8f5;
        color: #1c1917;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      img { width: 4rem; height: 4rem; border-radius: 1rem; }
      h1 { margin: 1.5rem 0 0.5rem; font-family: ui-serif, Georgia, serif; font-size: 2rem; }
      p { margin: 0; color: #6b6560; line-height: 1.5; }
      button {
        margin-top: 2rem;
        height: 3rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 9999px;
        background: #7a1f3d;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #5f1830; }
      button:focus-visible { outline: 2px solid #7a1f3d; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet. Assim que a conexão voltar, o Cerimoniários continua de onde parou.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
